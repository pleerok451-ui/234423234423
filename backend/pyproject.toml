[project]
name = "polymarket-cosmos-backend"
version = "0.1.0"
description = "FastAPI backend that proxies the Polymarket Gamma API and serves the cosmic 3D frontend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
